<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZenithFX — React Database</title>
    
    <!-- Load React and Babel (for compiling in browser) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        :root {
            --bg: #0f0c1b;
            --panel: #1a162b;
            --border: #3b3355;
            --accent: #a78bfa;
            --text: #ffffff;
            --text-muted: #8983a7;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 40px 20px; 
            margin: 0;
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--panel); 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h2 { margin: 0; color: var(--accent); font-weight: 600; }
        .back-btn {
            text-decoration: none;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--border); }
        
        form { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            background: #131020;
            padding: 20px;
            border-radius: 8px;
        }
        input { 
            padding: 10px 14px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
            background: #0f0c1b; 
            color: white; 
            flex: 1;
            min-width: 150px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        
        button { 
            padding: 10px 20px; 
            border-radius: 6px; 
            border: none; 
            background: var(--accent); 
            color: #0f0c1b; 
            font-weight: bold; 
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c4b5fd; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-cancel:hover { background: var(--border); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover td { background: rgba(167, 139, 250, 0.05); }
        
        .btn-delete { background: #ef4444; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #dc2626; }
        .btn-edit { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; font-size: 12px; margin-right: 8px; }
        .btn-edit:hover { background: rgba(167, 139, 250, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = '/api/react/students';

        function App() {
            const [students, setStudents] = useState([]);
            const [formData, setFormData] = useState({ id: null, name: '', neptunCode: '', course: '' });

            useEffect(() => { fetchStudents(); }, []);

            const fetchStudents = async () => {
                try {
                    const res = await axios.get(API_URL);
                    setStudents(res.data);
                } catch (e) { console.error("Error fetching data", e); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (formData.id) {
                        await axios.put(`${API_URL}/${formData.id}`, formData);
                    } else {
                        await axios.post(API_URL, formData);
                    }
                    setFormData({ id: null, name: '', neptunCode: '', course: '' });
                    fetchStudents();
                } catch (e) { console.error("Error saving data", e); }
            };

            const handleEdit = (student) => setFormData(student);
            
            const handleDelete = async (id) => {
                try {
                    await axios.delete(`${API_URL}/${id}`);
                    fetchStudents();
                } catch (e) { console.error("Error deleting data", e); }
            };

            return (
                <div className="container">
                    
                    <div className="header-bar">
                        <h2>⚛ React CRUD Database</h2>
                        <a href="/" className="back-btn">← Back to Home</a>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <input type="text" placeholder="Full Name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} required />
                        <input type="text" placeholder="Neptun Code" value={formData.neptunCode} onChange={(e) => setFormData({...formData, neptunCode: e.target.value})} required />
                        <input type="text" placeholder="Course (e.g. Java)" value={formData.course} onChange={(e) => setFormData({...formData, course: e.target.value})} />
                        
                        <button type="submit">{formData.id ? 'Update Record' : 'Add Record'}</button>
                        
                        {formData.id && (
                            <button type="button" className="btn-cancel" onClick={() => setFormData({ id: null, name: '', neptunCode: '', course: '' })}>
                                Cancel
                            </button>
                        )}
                    </form>

                    <table>
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Neptun Code</th><th>Course</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            {students.length === 0 ? (
                                <tr><td colSpan="5" style={{textAlign: 'center', color: '#8983a7'}}>No records found in the database.</td></tr>
                            ) : (
                                students.map(s => (
                                    <tr key={s.id}>
                                        <td>{s.id}</td>
                                        <td>{s.name}</td>
                                        <td>{s.neptunCode}</td>
                                        <td>{s.course || '-'}</td>
                                        <td>
                                            <button className="btn-edit" onClick={() => handleEdit(s)}>Edit</button>
                                            <button className="btn-delete" onClick={() => handleDelete(s.id)}>Delete</button>
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
