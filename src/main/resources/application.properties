spring.application.name=ZenithFX
server.port=8080
spring.thymeleaf.cache=false
spring.config.import=optional:file:./application-local.properties
oanda.base-url=${OANDA_BASE_URL:https://api-fxpractice.oanda.com}
oanda.account-id=${OANDA_ACCOUNT_ID:}
oanda.api-token=${OANDA_API_TOKEN:}
app.creator-line=${APP_CREATOR_LINE:Abdurrahman Umar Baba - cw6nlt }


# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:C:/data/zenithdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Enable H2 Console to view the database in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console