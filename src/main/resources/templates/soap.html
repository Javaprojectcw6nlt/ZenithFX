<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HNB SOAP · ZenithFX</title><link rel="stylesheet" href="/css/zenith.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div th:replace="~{fragments :: header('soap')}"></div><main class="container page-container"><div class="page-heading"><span class="eyebrow">CURRENCY INTELLIGENCE</span><h1>HNB <span class="gradient-text">Exchange Rates</span></h1><p>Retrieve historical rates from the Hungarian National Bank SOAP web service.</p></div><section class="panel"><form id="hnbForm" class="form-grid"><label>Currency<select id="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option><option>JPY</option><option>PLN</option><option>CZK</option></select></label><label>Start date<input id="startDate" type="date" required></label><label>End date<input id="endDate" type="date" required></label><button class="btn btn-primary" type="submit">Fetch rates ↗</button></form><div id="hnbStatus" class="status" aria-live="polite">Choose a currency and date range, then fetch rates.</div></section><section class="panel"><div class="panel-heading"><div><span class="eyebrow">RATE HISTORY</span><h2>Exchange-rate chart</h2></div><span class="tag">Chart.js</span></div><div class="chart-wrap"><canvas id="rateChart"></canvas></div></section><section class="panel"><div class="panel-heading"><div><span class="eyebrow">SERVICE RESPONSE</span><h2>Returned rates</h2></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Currency</th><th>Unit</th><th>Rate (HUF)</th></tr></thead><tbody id="ratesBody"><tr><td colspan="4" class="empty">No data loaded yet.</td></tr></tbody></table></div></section></main><div th:replace="~{fragments :: footer}"></div><script src="/js/zenith.js"></script><script>document.addEventListener('DOMContentLoaded', initHnb);</script></body></html>
