<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Price History · ZenithFX</title><link rel="stylesheet" href="/css/zenith.css"></head><body><div th:replace="~{fragments :: header('history')}"></div><main class="container page-container"><div class="page-heading"><span class="eyebrow">HISTORICAL MARKET DATA</span><h1>Price <span class="gradient-text">History</span></h1><p>View the latest ten candlesticks for a selected instrument and granularity.</p></div><section class="panel"><form id="historyForm" class="form-grid"><label>Instrument<select id="historyInstrument"><option>EUR_USD</option><option>GBP_USD</option><option>USD_JPY</option><option>AUD_USD</option><option>USD_CAD</option><option>USD_CHF</option></select></label><label>Granularity<select id="granularity"><option value="D">D — Daily</option><option value="H1">H1 — 1 hour</option><option value="H4">H4 — 4 hours</option><option value="M15">M15 — 15 minutes</option><option value="M5">M5 — 5 minutes</option></select></label><button class="btn btn-primary" type="submit">Load last 10 ↗</button></form><div id="historyStatus" class="status">Choose an instrument and granularity.</div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th></tr></thead><tbody id="historyBody"><tr><td colspan="6" class="empty">No history loaded.</td></tr></tbody></table></div><pre id="historyRaw" class="json-output hidden"></pre></section></main><div th:replace="~{fragments :: footer}"></div><script src="/js/zenith.js"></script></body></html>
