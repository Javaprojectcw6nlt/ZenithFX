<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Prices · ZenithFX</title><link rel="stylesheet" href="/css/zenith.css"></head><body><div th:replace="~{fragments :: header('prices')}"></div><main class="container page-container"><div class="page-heading"><span class="eyebrow">LIVE MARKET DATA</span><h1>Current <span class="gradient-text">Forex Prices</span></h1><p>Select an instrument to request the current bid and ask prices from OANDA.</p></div><section class="panel"><form id="priceForm" class="form-grid"><label>Instrument<select id="priceInstrument"><option>EUR_USD</option><option>GBP_USD</option><option>USD_JPY</option><option>AUD_USD</option><option>USD_CAD</option><option>USD_CHF</option><option>NZD_USD</option><option>EUR_GBP</option></select></label><button class="btn btn-primary" type="submit">Get current price ↗</button></form><div id="priceStatus" class="status">Choose an instrument to begin.</div><div id="priceCards" class="price-grid"></div><pre id="priceRaw" class="json-output hidden"></pre></section></main><div th:replace="~{fragments :: footer}"></div><script src="/js/zenith.js"></script></body></html>
